name: Rebuild Beyond Work Index

on:
  push:
    branches:
      - main
    paths:
      - content/beyond-work/**

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build article index
        run: node scripts/build-index.js

      - name: Commit updated index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/beyond-work/index.json
          if git diff --cached --quiet; then
            echo "No index changes to commit."
          else
            git commit -m "chore: rebuild beyond-work index"
            git push origin HEAD:main
          fi
