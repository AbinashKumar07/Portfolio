backend:
  name: github
  repo: AbinashKumar07/Portfolio
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "assets/uploads"

site_url: https://peppy-bublanina-b8a53f.netlify.app/
display_url: https://peppy-bublanina-b8a53f.netlify.app/
logo_url: /assets/profile.png

collections:
  - name: "beyond_work"
    label: "✨ Beyond Work — Articles"
    create: true
    folder: "content/beyond-work"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug (URL identifier)", name: "slug", widget: "string", hint: "e.g. why-discipline-beats-motivation" }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Excerpt (shown on card)", name: "excerpt", widget: "text" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Fashion"
          - "Food"
          - "Travel"
          - "Gaming"
          - "Anime"
          - "Religion"
          - "Nationalism"
          - "Psychology"
          - "Writing"
          - "Content strategies"
          - "Personal Growth"
          - "Books"
          - "Life lessons"
        default: "Psychology"
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Status", name: "status", widget: "select", options: ["Published", "Draft"], default: "Published" }
      - label: "SEO & Keywords"
        name: "seo"
        widget: "object"
        fields:
          - { label: "SEO Title (max 60 chars)", name: "seoTitle", widget: "string", required: false }
          - { label: "Meta Description (max 160 chars)", name: "metaDescription", widget: "text", required: false }
          - { label: "Keywords (comma-separated)", name: "keywords", widget: "string", required: false }
          - { label: "Social Share Image (OG Image)", name: "ogImage", widget: "image", required: false }

  - name: "hero"
    label: "🏠 Homepage — Hero Section"
    files:
      - name: "hero"
        label: "Hero Content"
        file: "content/hero.json"
        fields:
          - { label: "Status Pill Text", name: "statusPill", widget: "string", default: "CONTENT STRATEGIST • PUBLISHED AUTHOR" }
          - { label: "Headline Line 1", name: "headlineLine1", widget: "string", default: "Words that move people." }
          - { label: "Headline Line 2 (Accent)", name: "headlineLine2", widget: "string", default: "Strategies that move brands." }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Primary CTA Text", name: "ctaPrimaryText", widget: "string", default: "Let's collaborate" }
          - { label: "Primary CTA Link", name: "ctaPrimaryLink", widget: "string", default: "#contact" }
          - { label: "Secondary CTA Text", name: "ctaSecondaryText", widget: "string", default: "View Full Resume" }
          - { label: "Portrait Image", name: "portraitImage", widget: "image" }

  - name: "philosophy"
    label: "📖 Homepage — Philosophy Section"
    files:
      - name: "philosophy"
        label: "Philosophy Content"
        file: "content/philosophy.json"
        fields:
          - { label: "Section Tag", name: "sectionTag", widget: "string", default: "01 / The Philosophy" }
          - { label: "Title", name: "title", widget: "string", default: "More Than a Job Title" }
          - { label: "Subtitle", name: "subtitle", widget: "text" }
          - { label: "Quote", name: "quote", widget: "text" }
          - { label: "Body Paragraph 1", name: "bodyOne", widget: "text" }
          - { label: "Body Paragraph 2", name: "bodyTwo", widget: "text" }

  - name: "books"
    label: "📚 Homepage — Books"
    create: true
    folder: "content/books"
    slug: "{{slug}}"
    fields:
      - { label: "Book Title", name: "title", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "string" }
      - { label: "Cover Image", name: "cover", widget: "image" }
      - { label: "Summary", name: "summary", widget: "text" }
      - name: "keyThemes"
        label: "Core Themes"
        widget: "list"
        fields:
          - { label: "Theme Title", name: "themeTitle", widget: "string" }
          - { label: "Theme Description", name: "themeDescription", widget: "text" }
      - { label: "Purchase Link", name: "purchaseLink", widget: "string" }
      - { label: "Order", name: "order", widget: "number", default: 1 }

  - name: "footer"
    label: "🔗 Global Footer Settings"
    files:
      - name: "footer"
        label: "Footer Settings"
        file: "content/footer.json"
        fields:
          - { label: "Bio Text", name: "bio", widget: "text" }
          - { label: "Availability Text", name: "availabilityText", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string", default: "https://www.linkedin.com/in/abinashkumar07/" }
          - { label: "Instagram URL", name: "instagram", widget: "string", default: "https://www.instagram.com/abinashsays_/" }
          - { label: "GitHub URL", name: "github", widget: "string", default: "https://github.com/AbinashKumar07" }
          - { label: "Linktree URL", name: "linktree", widget: "string", default: "https://linktr.ee/ABINASHKUMAR1" }
